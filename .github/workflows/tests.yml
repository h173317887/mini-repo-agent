name: Python tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install Python
        run: uv python install 3.14
      - name: Install locked dependencies
        run: uv sync --frozen --group dev
      - name: Run all unit and scripted integration tests
        run: uv run pytest -q
