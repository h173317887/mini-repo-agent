[project]
name = "mini-repo-agent"
version = "0.1.0"
description = "Minimal read-only coding Agent for learning ReAct and Harness"
requires-python = ">=3.10"
dependencies = [
    "langchain>=1.4.10",
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.24",
    "openai>=1.0,<3.0",
    "python-dotenv>=1.0,<2.0",
]

[dependency-groups]
dev = ["pytest>=8.0,<10.0"]
